services:
  mongodb:
    image: mongo:7
    container_name: beautybook-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - beautybook_mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beautybook-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - beautybook_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for local dev — see
  # apps/backend/src/shared/storage/s3Storage.ts. Matches
  # S3_ENDPOINT/S3_FORCE_PATH_STYLE in apps/backend/.env.example.
  # Console UI at http://localhost:9001 (default creds: minioadmin/minioadmin).
  minio:
    image: minio/minio:latest
    container_name: beautybook-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - beautybook_minio_data:/data

volumes:
  beautybook_mongodb_data:
  beautybook_redis_data:
  beautybook_minio_data:
